<?xml version='1.0' encoding='utf-8'?>
<fontconfig>
  <dir>C:/Windows/Fonts</dir>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <dir>~/.fonts</dir>
  <dir>/System/Library/Fonts</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <dir prefix="cwd">assets/fonts</dir>
  <cachedir>~/.fontconfig</cachedir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
  <config>
    <rescan>
      <int>30</int>
    </rescan>
  </config>
  <alias>
    <family>equation</family>
    <prefer>
      <family>Asana Math</family>
      <family>Fira Math</family>
      <family>NewComputerModern Math</family>
      <family>NewComputerModern Sans Math</family>
      <family>STIX Two Math</family>
      <family>TeX Gyre Bonum Math</family>
      <family>TeX Gyre DejaVu Math</family>
      <family>TeX Gyre Pagella Math</family>
      <family>TeX Gyre Schola Math</family>
      <family>TeX Gyre Termes Math</family>
    </prefer>
  </alias>
  <alias>
    <family>text</family>
    <prefer>
      <family>LMMono10</family>
      <family>LMMono12</family>
      <family>LMMono8</family>
      <family>LMMono9</family>
      <family>LMMonoCaps10</family>
      <family>LMMonoLt10</family>
      <family>LMMonoLtCond10</family>
      <family>LMMonoProp10</family>
      <family>LMMonoPropLt10</family>
      <family>LMMonoSlant10</family>
      <family>LMRoman10</family>
      <family>LMRoman12</family>
      <family>LMRoman17</family>
      <family>LMRoman5</family>
      <family>LMRoman6</family>
      <family>LMRoman7</family>
      <family>LMRoman8</family>
      <family>LMRoman9</family>
      <family>LMRomanCaps10</family>
      <family>LMRomanDemi10</family>
      <family>LMRomanDunh10</family>
      <family>LMRomanSlant10</family>
      <family>LMRomanSlant12</family>
      <family>LMRomanSlant8</family>
      <family>LMRomanSlant9</family>
      <family>LMRomanUnsl10</family>
      <family>LMSans10</family>
      <family>LMSans12</family>
      <family>LMSans17</family>
      <family>LMSans8</family>
      <family>LMSans9</family>
      <family>LMSansDemiCond10</family>
      <family>LMSansQuot8</family>
      <family>NewComputerModern</family>
      <family>NewCM08Devanagari</family>
      <family>NewComputerModern 10 Devanagari</family>
      <family>NewComputerModern Mono</family>
      <family>NewComputerModern Sans</family>
      <family>NewCMUncial08</family>
      <family>NewCMUncial10</family>
      <family>NewComputerModernUncial10</family>
      <family>STIX Two Text</family>
    </prefer>
  </alias>
</fontconfig>