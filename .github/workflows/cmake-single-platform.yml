name: CMake Multi-Stage Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          gperf \
          autoconf \
          autoconf-archive \
          automake \
          libtool \
          bison \
          flex \
          libfontconfig1-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libexpat1-dev \
          libgl1-mesa-dev

    - name: Cache vcpkg Binary Artifacts
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg/archives
        key: vcpkg-${{ runner.os }}-skia-${{ hashFiles('**/vcpkg.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-skia-

    - name: Install Skia via vcpkg
      run: $VCPKG_INSTALLATION_ROOT/vcpkg install skia:x64-linux

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -G Ninja
        -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
        -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake

    - name: Compile Project
      run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }}

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: build-tree
        path: ${{ github.workspace }}/build

  test:
    name: Test Stage
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Runtime Test Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libfontconfig1 \
          libfreetype6 \
          libharfbuzz0b \
          libexpat1 \
          libgl1-mesa-glx

    - name: Download Build Output
      uses: actions/download-artifact@v4
      with:
        name: build-tree
        path: ${{ github.workspace }}/build

    - name: Run CTest Suite
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -C ${{ env.BUILD_TYPE }}
